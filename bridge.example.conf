# gost-tls-bridge configuration (пример)
# Скопируй в <workdir>/bridge.conf или укажи путь флагом -c.

# Целевой ГОСТ-TLS сервер.
target_host = gost.example.ru
target_port = 443
# SNI; пусто = target_host.
sni =

# Куда Burp шлёт upstream (наш relay-серт, обычный TLS).
front_listen = 127.0.0.1:443
# Внутренний plaintext-хоп между front и ГОСТ-плечом.
gost_listen = 127.0.0.1:18080

relay_cert = C:\gost\relay.pem

# backend: auto | windows-msspi | linux-gostengine
backend = auto
stunnel_bin = C:\gost\ossl_all\bin\stunnel.exe
stunnel_msspi_bin = C:\gost\stunnel-msspi.exe

workdir = C:\gost
