# gost-tls-bridge configuration (пример, Linux/macOS)
# Скопируй в <workdir>/bridge.conf или укажи путь флагом -c.

# Целевой ГОСТ-TLS сервер.
target_host = gost.example.ru
target_port = 443
# SNI; пусто = target_host.
sni =

# Куда Burp шлёт upstream (наш relay-серт, обычный TLS).
# Порт >1024, чтобы не требовать root; в Burp укажи этот же порт.
front_listen = 127.0.0.1:8443
# Внутренний plaintext-хоп между front и ГОСТ-плечом.
gost_listen = 127.0.0.1:18080

# Пути по умолчанию ложатся в ~/.gost-tls-bridge (см. workdir ниже).
relay_cert = relay.pem

# backend: auto | windows-msspi | linux-gostengine
# На Linux/macOS ГОСТ-плечо — stunnel, собранный с OpenSSL gost-engine.
backend = auto
stunnel_bin = stunnel
stunnel_msspi_bin = stunnel

# Пусто/относительные пути считаются от рабочего каталога запуска.
workdir = .
